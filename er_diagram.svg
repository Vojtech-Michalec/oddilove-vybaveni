<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <title>ER diagram — Správa oddílového vybavení</title>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- TABULKA 1: kategorie_vybaveni -->
  <rect x="30" y="80" width="190" height="120" rx="6" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="30" y="80" width="190" height="36" rx="6" fill="#6366f1"/>
  <rect x="30" y="104" width="190" height="12" fill="#6366f1"/>
  <text x="125" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="white">kategorie_vybaveni</text>
  <text x="48" y="132" font-size="11.5" fill="#6366f1" font-weight="700">🔑 id</text>
  <text x="185" y="132" text-anchor="end" font-size="11" fill="#64748b">SERIAL PK</text>
  <line x1="30" y1="140" x2="220" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="158" font-size="11.5" fill="#1e293b">nazev</text>
  <text x="185" y="158" text-anchor="end" font-size="11" fill="#64748b">VARCHAR(100)</text>
  <text x="185" y="172" text-anchor="end" font-size="10" fill="#94a3b8">NOT NULL UNIQUE</text>
  <rect x="58" y="185" width="104" height="18" rx="9" fill="#ede9fe"/>
  <text x="110" y="197" text-anchor="middle" font-size="10" fill="#7c3aed" font-weight="600">číselník (seed.sql)</text>

  <!-- TABULKA 2: vybaveni -->
  <rect x="290" y="60" width="200" height="196" rx="6" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="290" y="60" width="200" height="36" rx="6" fill="#6366f1"/>
  <rect x="290" y="84" width="200" height="12" fill="#6366f1"/>
  <text x="390" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="white">vybaveni</text>
  <text x="308" y="112" font-size="11.5" fill="#6366f1" font-weight="700">🔑 id</text>
  <text x="475" y="112" text-anchor="end" font-size="11" fill="#64748b">SERIAL PK</text>
  <line x1="290" y1="120" x2="490" y2="120" stroke="#e2e8f0" stroke-width="1"/>
  <text x="308" y="138" font-size="11.5" fill="#1e293b">nazev</text>
  <text x="475" y="138" text-anchor="end" font-size="11" fill="#64748b">VARCHAR(200)</text>
  <line x1="290" y1="146" x2="490" y2="146" stroke="#e2e8f0" stroke-width="1"/>
  <text x="308" y="164" font-size="11.5" fill="#94a3b8">popis</text>
  <text x="475" y="164" text-anchor="end" font-size="11" fill="#64748b">TEXT nullable</text>
  <line x1="290" y1="172" x2="490" y2="172" stroke="#e2e8f0" stroke-width="1"/>
  <text x="308" y="190" font-size="11.5" fill="#1e293b">pocet_kusu</text>
  <text x="475" y="190" text-anchor="end" font-size="11" fill="#64748b">INTEGER ≥ 1</text>
  <line x1="290" y1="198" x2="490" y2="198" stroke="#e2e8f0" stroke-width="1"/>
  <text x="308" y="220" font-size="11.5" fill="#dc2626" font-weight="600">🔗 kategorie_id</text>
  <text x="475" y="220" text-anchor="end" font-size="11" fill="#64748b">INTEGER FK</text>
  <text x="475" y="233" text-anchor="end" font-size="10" fill="#94a3b8">NOT NULL</text>

  <!-- TABULKA 3: vypujcka -->
  <rect x="560" y="80" width="195" height="246" rx="6" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="560" y="80" width="195" height="36" rx="6" fill="#6366f1"/>
  <rect x="560" y="104" width="195" height="12" fill="#6366f1"/>
  <text x="657" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="white">vypujcka</text>
  <text x="578" y="132" font-size="11.5" fill="#6366f1" font-weight="700">🔑 id</text>
  <text x="740" y="132" text-anchor="end" font-size="11" fill="#64748b">SERIAL PK</text>
  <line x1="560" y1="140" x2="755" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <text x="578" y="160" font-size="11.5" fill="#dc2626" font-weight="600">🔗 vybaveni_id</text>
  <text x="740" y="160" text-anchor="end" font-size="11" fill="#64748b">INTEGER FK</text>
  <text x="740" y="172" text-anchor="end" font-size="10" fill="#e11d48">CASCADE DELETE</text>
  <line x1="560" y1="178" x2="755" y2="178" stroke="#e2e8f0" stroke-width="1"/>
  <text x="578" y="196" font-size="11.5" fill="#1e293b">jmeno_cloveka</text>
  <text x="740" y="196" text-anchor="end" font-size="11" fill="#64748b">VARCHAR(200)</text>
  <line x1="560" y1="204" x2="755" y2="204" stroke="#e2e8f0" stroke-width="1"/>
  <text x="578" y="222" font-size="11.5" fill="#1e293b">datum_vypujcky</text>
  <text x="740" y="222" text-anchor="end" font-size="11" fill="#64748b">DATE</text>
  <line x1="560" y1="230" x2="755" y2="230" stroke="#e2e8f0" stroke-width="1"/>
  <text x="578" y="248" font-size="11.5" fill="#94a3b8">datum_vraceni</text>
  <text x="740" y="248" text-anchor="end" font-size="11" fill="#64748b">DATE nullable</text>
  <line x1="560" y1="256" x2="755" y2="256" stroke="#e2e8f0" stroke-width="1"/>
  <text x="578" y="274" font-size="11.5" fill="#94a3b8">poznamka</text>
  <text x="740" y="274" text-anchor="end" font-size="11" fill="#64748b">TEXT nullable</text>
  <text x="740" y="314" text-anchor="end" font-size="10" fill="#94a3b8">CHECK: vraceni &gt;= vypujcky</text>

  <!-- VZTAH 1: kategorie → vybaveni -->
  <line x1="220" y1="158" x2="289" y2="218" stroke="#6366f1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="228" y="168" font-size="13" font-weight="700" fill="#6366f1">1</text>
  <text x="268" y="214" font-size="13" font-weight="700" fill="#6366f1">N</text>

  <!-- VZTAH 2: vybaveni → vypujcka -->
  <line x1="490" y1="158" x2="559" y2="158" stroke="#6366f1" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="498" y="150" font-size="13" font-weight="700" fill="#6366f1">1</text>
  <text x="542" y="150" font-size="13" font-weight="700" fill="#6366f1">N</text>
  <rect x="490" y="162" width="68" height="16" rx="8" fill="#fef2f2"/>
  <text x="524" y="173" text-anchor="middle" font-size="10" fill="#e11d48" font-weight="600">ON DELETE CASCADE</text>

  <!-- LEGENDA -->
  <text x="30" y="368" font-size="11" fill="#6366f1" font-weight="700">🔑</text>
  <text x="46" y="368" font-size="11" fill="#475569">Primární klíč</text>
  <text x="170" y="368" font-size="11" fill="#dc2626" font-weight="700">🔗</text>
  <text x="186" y="368" font-size="11" fill="#475569">Cizí klíč (FK)</text>
  <text x="320" y="368" font-size="11" fill="#94a3b8">šedě = nullable</text>
  <text x="460" y="368" font-size="11" fill="#e11d48">CASCADE = smazání rodiče smaže i děti</text>
</svg>
